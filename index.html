<style>
:root{--bg:#070b14;--bg2:#0e1524;--card:#121b2e;--line:#1e2a44;--tx:#e8eefc;--mut:#8b9ac0;--a:#2dd4bf;--b:#818cf8;--grad:linear-gradient(135deg,#2dd4bf,#818cf8);--r:14px}
:root[data-theme=light]{--bg:#f3f6fc;--bg2:#fff;--card:#fff;--line:#dbe3f3;--tx:#111a30;--mut:#5b6a8c;--a:#0d9488;--b:#4f46e5;--grad:linear-gradient(135deg,#0d9488,#4f46e5)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;
background-image:radial-gradient(60vw 40vh at 10% -10%,rgba(45,212,191,.14),transparent),radial-gradient(50vw 40vh at 100% 0,rgba(129,140,248,.14),transparent);background-attachment:fixed}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
header{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid var(--line)}
.nav{max-width:1280px;margin:auto;display:flex;align-items:center;gap:18px;padding:12px 18px;flex-wrap:wrap}
.logo{display:flex;align-items:center;line-height:0}.logo img{height:44px;width:auto;display:block;filter:drop-shadow(0 0 10px rgba(168,85,247,.35))}
@media(max-width:720px){.logo img{height:36px}}
.links{display:flex;gap:4px;flex-wrap:wrap}.links a{padding:7px 12px;border-radius:99px;color:var(--mut);font-size:.92rem}
.links a:hover,.links a.on{color:var(--tx);background:var(--card)}
.sp{flex:1}
.sb{display:flex;background:var(--card);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.sb input{background:none;border:0;outline:0;color:var(--tx);padding:8px 14px;width:200px;font:inherit}
.sb button{padding:0 14px;color:var(--a)}
.ic{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--line)}
main{max-width:1280px;margin:auto;padding:22px 18px 60px}
h2.t{font-size:1.25rem;margin:30px 0 14px;display:flex;align-items:center;gap:10px}
h2.t:before{content:"";width:5px;height:20px;border-radius:4px;background:var(--grad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:.25s;position:relative}
.card:hover{transform:translateY(-5px);border-color:var(--a);box-shadow:0 12px 30px -12px var(--a)}
.card .im{aspect-ratio:3/4;background:var(--bg2) center/cover no-repeat;position:relative}
.card .bd{position:absolute;left:8px;top:8px;background:var(--grad);color:#04121a;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:99px}
.card .tt{padding:10px 11px 3px;font-size:.9rem;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.card .mt{padding:0 11px 10px;font-size:.78rem;color:var(--mut)}
.hero{position:relative;border-radius:22px;overflow:hidden;min-height:340px;border:1px solid var(--line);background:var(--bg2)}
.hero .bg{position:absolute;inset:0;background-size:cover;background-position:center 20%;filter:blur(26px) brightness(.45);transform:scale(1.2);transition:.6s}
.hero .in{position:relative;display:flex;gap:26px;padding:28px;align-items:center;color:#fff}
.hero img{width:200px;aspect-ratio:3/4;object-fit:cover;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.hero h1{font-size:clamp(1.4rem,3.4vw,2.4rem);line-height:1.15;margin:8px 0 10px}
.hero p{opacity:.85;max-width:560px}
.dots{position:absolute;right:20px;bottom:16px;display:flex;gap:7px;z-index:2}.dots i{width:9px;height:9px;border-radius:50%;background:#fff6;cursor:pointer}.dots i.on{background:var(--a);width:24px;border-radius:9px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:99px;background:var(--grad);color:#04121a;font-weight:700;margin-top:16px}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--line);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:6px 13px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:.85rem}.chip:hover,.chip.on{border-color:var(--a);color:var(--a)}
.det{display:grid;grid-template-columns:260px 1fr;gap:28px}
.det img{width:100%;border-radius:var(--r);border:1px solid var(--line)}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 20px;margin:14px 0;color:var(--mut);font-size:.9rem}.info b{color:var(--tx);font-weight:600}
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.ep{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:.88rem;display:flex;justify-content:space-between;gap:8px;align-items:center}
.ep:hover{border-color:var(--a)}.ep small{color:var(--mut);white-space:nowrap}.ep.seen{opacity:.55}
.player{aspect-ratio:16/9;background:#000;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.player iframe,.player video{width:100%;height:100%;border:0}
.srv{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}.srv b{color:var(--mut);font-size:.85rem;min-width:52px}
.srv button{padding:6px 13px;border-radius:9px;background:var(--card);border:1px solid var(--line);font-size:.84rem}.srv button:hover,.srv button.on{border-color:var(--a);color:var(--a)}
.pg{display:flex;justify-content:center;gap:10px;margin-top:28px;align-items:center;color:var(--mut)}
.day{margin-bottom:6px}.ld,.err{padding:70px 0;text-align:center;color:var(--mut)}
.sp2{width:36px;height:36px;border:4px solid var(--line);border-top-color:var(--a);border-radius:50%;margin:0 auto 14px;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
footer{text-align:center;color:var(--mut);font-size:.8rem;padding:30px 18px;border-top:1px solid var(--line)}
.fl{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.fb{padding:9px 20px;border-radius:99px;font-weight:700;font-size:.9rem;color:#fff;transition:.2s}.fb:hover{transform:translateY(-2px);filter:brightness(1.1)}
.fb.dc{background:#5865f2}.fb.tk{background:#be1e2d}
.az{display:flex;flex-wrap:wrap;gap:6px;position:sticky;top:62px;z-index:20;padding:10px 0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
.az a{min-width:32px;text-align:center;padding:5px 8px;border-radius:8px;background:var(--card);border:1px solid var(--line);font-size:.82rem;font-weight:600}.az a:hover{border-color:var(--a);color:var(--a)}
.lf{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:99px;outline:0;color:var(--tx);padding:10px 16px;font:inherit;margin-bottom:6px}
.lg h3{margin:22px 0 10px;font-size:1.15rem;color:var(--a);scroll-margin-top:120px}
.ll{columns:240px;column-gap:20px}.ll a{display:block;padding:6px 10px;border-radius:8px;font-size:.9rem;break-inside:avoid}.ll a:hover{background:var(--card);color:var(--a)}
@media(max-width:720px){.det{grid-template-columns:1fr}.det img{max-width:220px}.hero .in{flex-direction:column;align-items:flex-start}.hero img{width:130px}.sb input{width:130px}.grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}}
</style>
</head>
